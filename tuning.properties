# =====================================================
# A. 运行控制
# =====================================================
iteration.coefficient=100.0

# =====================================================
# B. 重分配循环控制
# =====================================================
eval.maxReassignIterations=25
eval.keyPerturbThreshold=1
eval.keyPerturbStrength=0.02

# =====================================================
# C. 迁移策略
# =====================================================
coord.reassignStagnationThreshold=1
coord.zeroMigrationEarlyStopThreshold=5
coord.maxSecondChances=2
coord.reassignMigrationRatio=0.20
coord.reassignMigrationMaxCap=12

# =====================================================
# D. 候选目标星排序
# =====================================================
coord.reassignPriorityTaskTopK=5

# =====================================================
# E. k_task 权重
# =====================================================
coord.taskKeyPriorityWeight=0.55
coord.taskKeyFeasibilityWeight=0.30
coord.taskKeyRandomWeight=0.15

# E. k_sat 权重（任务-卫星亲和度）
coord.taskSatWindowCountWeight=0.40
coord.taskSatWindowLengthWeight=0.30
coord.taskSatEarliestStartWeight=0.20
coord.taskSatRandomWeight=0.10

# E. 星内任务排序权重
coord.orderedTaskInitialSatelliteBonus=1.50
coord.orderedTaskKeyWeight=1.00
coord.orderedTaskSatKeyWeight=0.65
coord.orderedTaskInitialOrderWeight=0.001

# E. 高价值任务排序权重
coord.prioritizedPriorityWeight=5.0
coord.prioritizedCandidateWeight=2.0
coord.prioritizedWindowWeight=1.0
coord.prioritizedTaskKeyWeight=3.0
coord.failedTaskPriorityBoost=0.25

# E. Fast Refine 排序权重
coord.fastRefineTaskKeyWeight=4.0
coord.fastRefineSatKeyWeight=2.5
coord.fastRefinePriorityWeight=3.0
coord.fastRefineConflictWeight=2.0

# E. k_sat 反馈
coord.taskSatSuccessBoost=0.08
coord.taskSatFailurePenalty=0.01
coord.baselineTieBreakScale=0.000001

# =====================================================
# F. 热启动预算
# =====================================================
coord.localRefineBudgetRatio=0.2
coord.fullRefineBudgetRatio=0.5
coord.fullRefineMinGenerations=20
coord.localRefineMinFesPerIndividual=5

# =====================================================
# G. Delta Fast Refine
# =====================================================
coord.deltaFastRefineMaxCandidatePositions=4
coord.deltaFastRefineWindowPreference=true
coord.fastRefineAdjacentSwapEnabled=true
coord.fastRefineSwapRadius=5

# =====================================================
# H. Replacement / Swap / Bundle
# =====================================================
coord.replacementMaxTrialsPerSat=3
coord.maxBatchRemoval=3
coord.replacementNearbyGapSeconds=60.0
coord.swapMaxCandidatesPerSat=3
coord.swapMaxReceiverSats=2
coord.bundleMaxSize=3
coord.bundleTimeProximityThreshold=120.0
coord.bundleMaxAttemptsPerRound=5
coord.initialEnsembleSize=2

# =====================================================
# I. TargetSatelliteRanker — cheap rank 顶层权重
# =====================================================
ranker.cheapPairWeightHighValue=0.55
ranker.cheapPairWeightNormal=0.55

# cheap rank - pair 子分数
ranker.cheapPairWindowCountWeight=0.28
ranker.cheapPairWindowLengthWeight=0.22
ranker.cheapPairEarliestStartWeight=0.18
ranker.cheapPairTaskSatKeyWeight=0.20
ranker.cheapPairWindowCompatWeight=0.12

# cheap rank - task 子分数
ranker.cheapTaskPriorityWeight=0.45
ranker.cheapTaskTightnessWeight=0.30
ranker.cheapTaskUnschedPressureWeight=0.25
ranker.ordinaryTopK=2
ranker.prioritizedTopK=4

# =====================================================
# I. TargetSatelliteRanker — extractPairFeatures 内部组合权重
# =====================================================
ranker.featWindowCompatCountWeight=0.55
ranker.featWindowCompatLengthWeight=0.45

# =====================================================
# J. CompositeStrategy 分配权重
# =====================================================
assign.compositeWindowLengthWeight=0.37
assign.compositeWindowCountWeight=0.20
assign.compositeLoadBalanceWeight=0.25
assign.compositeConflictWeight=0.25

# =====================================================
# K. GA 单父算法调参
# =====================================================
ga.probCrossover=0.9
ga.probMutation=0.15
ga.kTournament=2
ga.sigmaScale=0.2
ga.nElite=1
ga.maxMutationDimRatio=0.1
# Optional adaptive mutation decay. 2026-05-18 ID1 A/B failed to improve default,
# so keep disabled unless explicitly testing.
